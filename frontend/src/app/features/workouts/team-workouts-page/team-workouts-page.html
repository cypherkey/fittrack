<div class="page-header">
  <h1>My Team Workouts</h1>
</div>

<mat-card class="filters-card">
  <mat-card-content>
    <form [formGroup]="filterForm" class="filters" (ngSubmit)="applyFilters()">
      <mat-form-field appearance="outline">
        <mat-label>From</mat-label>
        <input matInput type="datetime-local" formControlName="from" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>To</mat-label>
        <input matInput type="datetime-local" formControlName="to" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="exercise-filter">
        <mat-label>Exercise</mat-label>
        <input
          matInput
          type="text"
          autocomplete="off"
          formControlName="exerciseName"
          [matAutocomplete]="exerciseAuto"
          (focus)="onExerciseFocus()"
          (input)="onExerciseInput()"
        />
        <mat-autocomplete
          #exerciseAuto="matAutocomplete"
          (optionSelected)="onExerciseAutocompleteSelected($event)"
        >
          @for (ex of exerciseOptions(); track ex.id) {
            <mat-option [value]="ex.name">{{ ex.name }}</mat-option>
          }
        </mat-autocomplete>
      </mat-form-field>
      <div class="filter-actions">
        <button mat-flat-button color="primary" type="submit">Apply</button>
        <button mat-button type="button" (click)="clearFilters()">Clear</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

@if (loading()) {
  <div class="loading"><mat-spinner diameter="40" /></div>
} @else {
  <table mat-table [dataSource]="workouts()" class="mat-elevation-z1">
    <ng-container matColumnDef="user">
      <th mat-header-cell *matHeaderCellDef>User</th>
      <td mat-cell *matCellDef="let row">{{ row.userDisplayName || '—' }}</td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Workout</th>
      <td mat-cell *matCellDef="let row">
        <a [routerLink]="['/workouts', row.id]">{{ row.name || '—' }}</a>
      </td>
    </ng-container>
    <ng-container matColumnDef="sets">
      <th mat-header-cell *matHeaderCellDef>Sets</th>
      <td mat-cell *matCellDef="let row">{{ row.setCount }}</td>
    </ng-container>
    <ng-container matColumnDef="weight">
      <th mat-header-cell *matHeaderCellDef>Total weight</th>
      <td mat-cell *matCellDef="let row">{{ formatTotalWeight(row) }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button type="button" (click)="view(row.id)" aria-label="View">
          <mat-icon>visibility</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
}
