<div class="page-header">
  <h1>Workouts</h1>
  <button mat-flat-button color="primary" type="button" (click)="create()">
    <mat-icon>add</mat-icon>
    Log workout
  </button>
</div>

<mat-card class="filters-card">
  <mat-card-content>
    <form [formGroup]="filterForm" class="filters" (ngSubmit)="applyFilters()">
      <mat-form-field appearance="outline">
        <mat-label>From</mat-label>
        <input matInput type="datetime-local" formControlName="from" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>To</mat-label>
        <input matInput type="datetime-local" formControlName="to" />
      </mat-form-field>
      <div class="filter-actions">
        <button mat-flat-button color="primary" type="submit">Apply</button>
        <button mat-button type="button" (click)="clearFilters()">Clear</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

@if (loading()) {
  <div class="loading"><mat-spinner diameter="40" /></div>
} @else {
  <table mat-table [dataSource]="workouts()" class="mat-elevation-z1">
    <ng-container matColumnDef="startedAt">
      <th mat-header-cell *matHeaderCellDef>Started</th>
      <td mat-cell *matCellDef="let row">{{ formatDate(row.startedAt) }}</td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">
        <a [routerLink]="['/workouts', row.id]">{{ row.name || '—' }}</a>
      </td>
    </ng-container>
    <ng-container matColumnDef="difficulty">
      <th mat-header-cell *matHeaderCellDef>Difficulty</th>
      <td mat-cell *matCellDef="let row">{{ row.difficulty || '—' }}</td>
    </ng-container>
    <ng-container matColumnDef="sets">
      <th mat-header-cell *matHeaderCellDef>Sets</th>
      <td mat-cell *matCellDef="let row">{{ row.setCount }}</td>
    </ng-container>
    <ng-container matColumnDef="weight">
      <th mat-header-cell *matHeaderCellDef>Total weight</th>
      <td mat-cell *matCellDef="let row">{{ row.totalWeightLifted ?? '—' }} kg</td>
    </ng-container>
        <ng-container matColumnDef="completed">
      <th mat-header-cell *matHeaderCellDef>Done</th>
      <td mat-cell *matCellDef="let row">{{ row.completed ? 'Yes' : 'No' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button type="button" (click)="view(row.id)" aria-label="View">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button type="button" (click)="edit(row.id)" aria-label="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button type="button" color="warn" (click)="delete(row)" aria-label="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="['startedAt', 'name', 'difficulty', 'sets', 'weight', 'completed', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['startedAt', 'name', 'difficulty', 'sets', 'weight', 'completed', 'actions']"></tr>
  </table>
}
