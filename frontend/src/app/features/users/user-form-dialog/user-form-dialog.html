<h2 mat-dialog-title>{{ isEdit ? 'Edit user' : 'Create user' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" [readonly]="isEdit" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ isEdit ? 'New password (optional)' : 'Password' }}</mat-label>
      <input matInput type="password" formControlName="password" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Display name</mat-label>
      <input matInput formControlName="displayName" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>
    <mat-checkbox formControlName="admin">Administrator</mat-checkbox>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="submit()" [disabled]="form.invalid">
    {{ isEdit ? 'Save' : 'Create' }}
  </button>
</mat-dialog-actions>
