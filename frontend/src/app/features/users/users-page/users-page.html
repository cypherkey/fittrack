<div class="page-header">
  <h1>Users</h1>
  <button mat-flat-button color="primary" type="button" (click)="createUser()">
    <mat-icon>person_add</mat-icon>
    Add user
  </button>
</div>

@if (loading()) {
  <div class="loading"><mat-spinner diameter="40" /></div>
} @else {
  <table mat-table [dataSource]="users()" class="mat-elevation-z1">
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef>Username</th>
      <td mat-cell *matCellDef="let row">{{ row.username }}</td>
    </ng-container>
    <ng-container matColumnDef="displayName">
      <th mat-header-cell *matHeaderCellDef>Display name</th>
      <td mat-cell *matCellDef="let row">{{ row.displayName || '-' }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let row">{{ row.email || '-' }}</td>
    </ng-container>
    <ng-container matColumnDef="admin">
      <th mat-header-cell *matHeaderCellDef>Admin</th>
      <td mat-cell *matCellDef="let row">{{ row.admin ? 'Yes' : 'No' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button type="button" (click)="editUser(row)" aria-label="Edit user">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button type="button" color="warn" (click)="deleteUser(row)" aria-label="Delete user">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="['username', 'displayName', 'email', 'admin', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['username', 'displayName', 'email', 'admin', 'actions']"></tr>
  </table>
}
