<h2 mat-dialog-title>Clone template to workout</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Workout name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>
    <p class="hint">Start/end times and completion are set when you log the workout.</p>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="submit()">Clone</button>
</mat-dialog-actions>
