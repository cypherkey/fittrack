<div class="title-row">
  <h2 mat-dialog-title>{{ title() }}</h2>
  <button mat-icon-button type="button" aria-label="Close" (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Notes</mat-label>
      <textarea matInput formControlName="notes" rows="5"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ readOnly ? 'Close' : 'Cancel' }}</button>
  @if (!readOnly) {
    <button mat-flat-button color="primary" type="button" (click)="save()">Save</button>
  }
</mat-dialog-actions>
