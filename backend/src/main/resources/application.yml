spring:
  application:
    name: fittrack-backend
  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/fittrack.db}?foreign_keys=true&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        type:
          preferred_instant_jdbc_type: VARCHAR
          preferred_boolean_jdbc_type: INTEGER
          preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid, profile, email

server:
  port: ${SERVER_PORT:8080}
  # Honor X-Forwarded-* when behind a TLS-terminating reverse proxy
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

fittrack:
  jwt:
    secret: ${JWT_SECRET:fittrack-dev-secret-change-me-must-be-at-least-256-bits-long!!}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  seed:
    default-username: ${FITTRACK_DEFAULT_USER:admin}
    default-password: ${FITTRACK_DEFAULT_PASSWORD:admin}
    default-display-name: ${FITTRACK_DEFAULT_DISPLAY_NAME:Admin}
    default-email: ${FITTRACK_DEFAULT_EMAIL:admin@localhost}
    # Load image bytes into image.content_base64 (classpath data/exercise-images/, else GitHub raw)
    load-images: ${FITTRACK_SEED_LOAD_IMAGES:true}
    download-images: ${FITTRACK_SEED_DOWNLOAD_IMAGES:true}
  # SPA origin(s); auth callback = {FRONTEND_URL}/auth/callback; Google OAuth redirect_uri =
  # {FRONTEND_URL}/login/oauth2/code/google; CORS uses the same value(s)
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  oauth2:
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.fittrack: ${LOG_LEVEL:INFO}
    org.springframework.security: ${LOG_LEVEL:INFO}
    org.springframework.web: ${LOG_LEVEL:INFO}