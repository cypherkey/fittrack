services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fittrack:local
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/fittrack.db
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-fittrack-compose-dev-secret-change-me-at-least-32-chars}
      FITTRACK_DEFAULT_USER: ${FITTRACK_DEFAULT_USER:-admin}
      FITTRACK_DEFAULT_PASSWORD: ${FITTRACK_DEFAULT_PASSWORD:-admin}
      # Same-origin SPA in the container image
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Optional Google SSO — set in .env / shell; omit when unused
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - fittrack-data:/data

volumes:
  fittrack-data:
