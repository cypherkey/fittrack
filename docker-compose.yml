services:
  api:
    build: ./backend
    image: fittrack-api:local
    ports:
      - "8080:8080"
    environment:
      FITTRACK_DB_PATH: /data/fittrack.db
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-fittrack-compose-dev-secret-change-me-at-least-32-chars}
      FITTRACK_DEFAULT_USER: ${FITTRACK_DEFAULT_USER:-admin}
      FITTRACK_DEFAULT_PASSWORD: ${FITTRACK_DEFAULT_PASSWORD:-admin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FITTRACK_SPA_AUTH_CALLBACK_URL: ${FITTRACK_SPA_AUTH_CALLBACK_URL:-http://localhost:4200/auth/callback}
      FITTRACK_CORS_ORIGINS: ${FITTRACK_CORS_ORIGINS:-http://localhost:4200}
    volumes:
      - fittrack-data:/data

volumes:
  fittrack-data:
